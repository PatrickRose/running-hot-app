name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # Also builds the frontend, which the feature tests need: rendering an
      # Inertia page fails without a Vite manifest.
      - name: Setup Application
        run: composer setup

      # Linting and static analysis run in their own workflow so a failure says
      # which check broke, rather than hiding inside a single job.
      #
      # Parallel because nearly every test creates a Game, which seeds the card
      # lists, and there are over a thousand of them: one process spent five
      # minutes on it. Paratest runs a worker per core, each with its own
      # in-memory database.
      - name: Run tests
        run: php artisan test --parallel
